<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet d'entretien</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5A623">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#141d33; --bg2:#1a2340; --card:#1e2a4a; --card2:#243054;
  --b:rgba(255,255,255,0.08); --b2:rgba(255,255,255,0.15);
  --t:#e8eaf0; --tm:#8b93b0; --tf:#4e567a;
  --o:#F5A623; --obg:rgba(245,166,35,0.13); --ob:rgba(245,166,35,0.4);
  --g:#2ecc71; --gbg:rgba(46,204,113,0.12); --gb:rgba(46,204,113,0.35);
  --r:#e74c3c; --rbg:rgba(231,76,60,0.12); --rb:rgba(231,76,60,0.4);
  --f:'Syne',sans-serif; --m:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--t);min-height:100vh}

/* ── HEADER ── */
.hdr{background:var(--bg2);border-bottom:2px solid var(--o);padding:0 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;height:54px}

/* Logo SVG animé */
.hdr-logo{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hdr-logo svg{width:36px;height:36px}

.hdr-title{display:flex;flex-direction:column;gap:1px}
.hdr-title h1{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--o);line-height:1}
.hdr-title .sub2{font-size:9px;color:var(--tf);font-family:var(--m);letter-spacing:.06em}

.save-badge{margin-left:auto;font-size:10px;color:var(--g);font-family:var(--m);opacity:0;transition:opacity .4s;display:flex;align-items:center;gap:4px}
.save-badge.show{opacity:1}
.offline-badge{font-size:9px;font-family:var(--m);color:var(--tm);background:var(--b2);border-radius:4px;padding:2px 7px;display:none}
.offline-badge.show{display:inline}

/* ── TABS ── */
.tabs{background:var(--bg2);display:flex;overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--b)}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;font-size:12px;font-weight:600;color:var(--tm);white-space:nowrap;flex-shrink:0;transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.tab:hover{color:var(--t)}
.tab.on{color:var(--o);border-bottom-color:var(--o)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tim{font-family:var(--m);font-size:9px;opacity:.5}

.main{max-width:980px;margin:0 auto;padding:16px}

/* ── IDENTITY CARD (accordéon) ── */
.icard{background:var(--card);border:1px solid var(--b2);border-radius:14px;overflow:hidden;margin-bottom:14px}

/* Header cliquable = résumé + toggle */
.icard-summary{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;transition:background .12s}
.icard-summary:hover{background:rgba(255,255,255,0.03)}
.stripe{width:4px;height:32px;border-radius:2px;flex-shrink:0}
.icard-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.icard-info .iname{font-size:15px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plate{background:var(--bg);border:1px solid var(--ob);border-radius:6px;padding:3px 10px;font-family:var(--m);font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--o);flex-shrink:0}
.imeta-pill{font-size:10px;font-family:var(--m);color:var(--tm);background:var(--b);border-radius:4px;padding:2px 6px}
.toggle-btn{flex-shrink:0;width:28px;height:28px;border-radius:7px;background:var(--b);display:flex;align-items:center;justify-content:center;color:var(--tm);font-size:13px;transition:all .2s}
.toggle-btn.open{background:var(--obg);color:var(--o);transform:rotate(180deg)}

/* Panneau dépliable */
.icard-panel{display:none;border-top:1px solid var(--b)}
.icard-panel.open{display:block}

/* Sous-sections à l'intérieur du panneau */
.isec{border-bottom:1px solid var(--b)}
.isec:last-child{border-bottom:none}
.isec-h{padding:9px 16px;background:var(--card2);display:flex;align-items:center;justify-content:space-between;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.isec-h span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--o)}
.isec-h .chev{font-size:11px;color:var(--tm);transition:transform .15s}
.isec-h.open .chev{transform:rotate(180deg)}
.isec-body{display:none}
.isec-body.open{display:block}

.igrid{display:grid;grid-template-columns:repeat(2,1fr)}
@media(min-width:600px){.igrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.igrid{grid-template-columns:repeat(4,1fr)}}

.if{padding:10px 14px;border-right:1px solid var(--b);border-bottom:1px solid var(--b)}
.igrid .if:nth-child(2n){border-right:none}
@media(min-width:600px){
  .igrid .if:nth-child(2n){border-right:1px solid var(--b)}
  .igrid .if:nth-child(3n){border-right:none}
}
@media(min-width:900px){
  .igrid .if:nth-child(3n){border-right:1px solid var(--b)}
  .igrid .if:nth-child(4n){border-right:none}
}
.if label{display:block;font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tf);margin-bottom:4px}
.if input,.if select,.if textarea{
  display:block;width:100%;border:none;border-radius:4px;background:transparent;
  font-family:var(--f);font-size:14px;font-weight:500;color:var(--t);
  padding:2px 0;outline:none;-webkit-appearance:none;min-height:28px;cursor:text;
}
.if input::placeholder{color:var(--tf);font-weight:400}
.if input:focus,.if select:focus{background:rgba(255,255,255,0.07);border-radius:4px;padding:2px 4px;margin:0 -4px;width:calc(100% + 8px)}
.if select{cursor:pointer;-webkit-appearance:menulist;appearance:menulist}
.if select option{background:var(--card2);color:var(--t)}
.mono-f input,.mono-f select{font-family:var(--m);font-size:12px}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.sc{background:var(--card);border:1px solid var(--b2);border-radius:12px;padding:13px 14px}
.sc .sl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--tf);margin-bottom:5px}
.sc .sv{font-size:22px;font-weight:700;color:var(--o);line-height:1}
.sc .su{font-size:11px;font-weight:400;color:var(--tm);margin-left:2px}
.sc .ss{font-size:10px;color:var(--tf);margin-top:4px;font-family:var(--m)}
.ct-ok{color:var(--g)!important}.ct-ko{color:var(--r)!important}

/* ── SECTION ── */
.sec{background:var(--card);border:1px solid var(--b2);border-radius:14px;overflow:hidden;margin-bottom:14px}
.sec-h{padding:11px 16px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;background:var(--card2)}
.sec-h h3{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--o);display:flex;align-items:center;gap:6px}
.btn-add{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:7px;border:1px solid var(--ob);background:var(--obg);font-family:var(--f);font-size:12px;font-weight:600;color:var(--o);cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent}
.btn-add:active{background:var(--o);color:var(--bg2)}

/* ── TABLE ── */
.twrap{overflow-x:auto}
.ht{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
.ht th{text-align:left;padding:8px 12px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tf);border-bottom:1px solid var(--b);background:var(--card2);white-space:nowrap}
.ht td{padding:10px 12px;border-bottom:1px solid var(--b);color:var(--t);vertical-align:middle}
.ht tr:last-child td{border-bottom:none}
.ht tbody tr:hover td{background:rgba(255,255,255,0.025)}
.mt{font-family:var(--m);font-size:11px}
.mut{color:var(--tm)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--obg);border:1px solid var(--ob);color:var(--o);white-space:nowrap}
.bdel{background:none;border:none;cursor:pointer;color:var(--tf);padding:4px 7px;border-radius:5px;font-size:13px;transition:all .1s;-webkit-tap-highlight-color:transparent}
.bdel:active{color:var(--r);background:var(--rbg)}

/* ── ADD FORM ── */
.af{display:none;padding:16px;background:var(--bg2);border-top:1px solid var(--b)}
.af.open{display:block}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
@media(min-width:600px){.fg{grid-template-columns:repeat(3,1fr)}}
.ff{display:flex;flex-direction:column;gap:4px}
.ff label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tf)}
.ff input,.ff select,.ff textarea{border:1px solid var(--b2);border-radius:7px;padding:8px 10px;font-family:var(--f);font-size:13px;background:var(--card);color:var(--t);outline:none;transition:border-color .12s;width:100%;min-height:36px}
.ff input::placeholder,.ff textarea::placeholder{color:var(--tf)}
.ff select option{background:var(--card2)}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--o)}
.ff textarea{resize:vertical;min-height:58px}
.ff-autre{border:1px solid var(--ob);border-radius:7px;padding:7px 10px;font-family:var(--f);font-size:13px;background:var(--card);color:var(--t);outline:none;width:100%;transition:border-color .12s}
.ff-autre::placeholder{color:var(--tf)}
.ff-autre:focus{border-color:var(--o)}
.fac{display:flex;gap:8px;margin-top:10px}
.bsave{padding:9px 20px;border-radius:7px;border:none;background:var(--o);color:var(--bg2);font-family:var(--f);font-size:13px;font-weight:700;cursor:pointer;min-height:40px;-webkit-tap-highlight-color:transparent}
.bsave:active{opacity:.8}
.bcancel{padding:9px 14px;border-radius:7px;border:1px solid var(--b2);background:transparent;color:var(--tm);font-family:var(--f);font-size:13px;cursor:pointer;min-height:40px}

/* ── INLINE TABLE INPUTS ── */
.ti{border:none;border-radius:4px;background:transparent;font-family:var(--f);font-size:12px;font-weight:500;color:var(--t);padding:2px 4px;margin:-2px -4px;outline:none;width:100%;min-width:60px;min-height:28px;cursor:text}
.ti::placeholder{color:var(--tf)}
.ti:focus{background:rgba(255,255,255,0.08);border-radius:4px}
.mono-ti{font-family:var(--m);font-size:11px}
.ti-sel{border:none;border-radius:6px;background:var(--obg);border:1px solid var(--ob);font-family:var(--f);font-size:11px;font-weight:600;color:var(--o);padding:3px 6px;outline:none;cursor:pointer;min-height:28px;max-width:160px}
.ti-sel option{background:var(--card2);color:var(--t)}
.ech-inp{border:none;border-bottom:1px solid rgba(255,255,255,0.15);background:transparent;font-family:var(--f);font-size:13px;font-weight:700;color:inherit;padding:2px 0;outline:none;width:100%;min-height:26px}
.ech-inp::placeholder{color:inherit;opacity:.4;font-weight:400}
.ech-inp:focus{border-bottom-color:currentColor}
.ech-inp.mono-ti{font-family:var(--m);font-size:11px;font-weight:400}
.echl{padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.ech{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:9px;font-size:13px;border:1px solid transparent;flex-wrap:wrap}
.ech.ok{background:var(--gbg);border-color:var(--gb);color:var(--g)}
.ech.soon{background:var(--obg);border-color:var(--ob);color:var(--o)}
.ech.urgent{background:var(--rbg);border-color:var(--rb);color:var(--r)}
.ech b{font-weight:700;flex:1;min-width:100px}
.ech .ed{font-size:11px;opacity:.8;font-family:var(--m)}
.esel{border:1px solid currentColor;border-radius:5px;padding:4px 6px;font-size:11px;font-weight:600;font-family:var(--f);background:transparent;color:inherit;cursor:pointer;min-height:28px}
.esel option{background:var(--card2);color:var(--t)}

/* ── NOTES ── */
.narea{padding:12px 16px}
.narea textarea{width:100%;border:1px solid var(--b2);border-radius:9px;padding:10px 12px;font-family:var(--f);font-size:13px;background:var(--bg2);color:var(--t);outline:none;resize:vertical;min-height:72px;transition:border-color .12s}
.narea textarea::placeholder{color:var(--tf)}
.narea textarea:focus{border-color:var(--o)}
.empty{padding:18px;text-align:center;font-size:12px;color:var(--tf)}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:12px}
.breset{font-size:11px;color:var(--tf);background:none;border:1px solid var(--b2);border-radius:5px;padding:4px 10px;cursor:pointer;font-family:var(--m)}
.breset:hover{color:var(--r);border-color:var(--rb)}
</style>
</head>

const LS_KEY = 'carnet_entretien_v1';
const LS_UI  = 'carnet_ui_v1';

function loadData(){
  try{ const r=localStorage.getItem(LS_KEY); if(r) return JSON.parse(r); }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function saveData(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify(VH));
    const sb=document.getElementById('sb');
    sb.classList.add('show');
    clearTimeout(window._sbt);
    window._sbt=setTimeout(()=>sb.classList.remove('show'),1800);
  }catch(e){}
}
function resetData(){
  if(!confirm('Réinitialiser toutes les données ? Cette action est irréversible.')) return;
  localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_UI);
  location.reload();
}

/* état UI persisté */
function loadUI(){ try{ return JSON.parse(localStorage.getItem(LS_UI)||'{}'); }catch(e){return {};} }
function saveUI(k,v){ try{ const u=loadUI(); u[k]=v; localStorage.setItem(LS_UI,JSON.stringify(u)); }catch(e){} }

let VH=loadData(), cur=0, adding=false;
const UI=loadUI(); // { panelOpen:bool, sections:{ id:bool } }

/* ── HELPERS ── */
const fd=s=>s?new Date(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const fk=n=>n?parseInt(n).toLocaleString('fr-FR'):'—';
const tot=v=>v.entretiens.reduce((s,e)=>s+(parseFloat(e.cout)||0),0);

/* ── TABS ── */
function renderTabs(){
  document.getElementById('tabs').innerHTML=VH.map((v,i)=>`
    <div class="tab${cur===i?' on':''}" onclick="sw(${i})">
      <span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>
      <span class="tname">${v.designation||'Véhicule '+(i+1)}</span>
      <span class="tim">${v.immat||'—'}</span>
    </div>`).join('');
  document.getElementById('vh-count').textContent=VH.length+' véhicule'+(VH.length>1?'s':'');
}
function updateTab(i){
  const tabs=document.querySelectorAll('.tab');
  if(!tabs[i]) return;
  const nm=tabs[i].querySelector('.tname'), im=tabs[i].querySelector('.tim');
  if(nm) nm.textContent=VH[i].designation||'Véhicule '+(i+1);
  if(im) im.textContent=VH[i].immat||'—';
}
function sw(i){ cur=i; adding=false; renderTabs(); renderID(); renderDyn(); }

/* ── IDENTITY UPDATE (sans re-render) ── */
function upd(key,val){
  VH[cur][key]=val;
  if(key==='designation'||key==='immat') updateTab(cur);
  saveData();
  // mise à jour du résumé visible dans le header de la carte
  const el=document.getElementById('icard-name'); if(el) el.textContent=VH[cur].designation||'Véhicule '+(cur+1);
  const pl=document.getElementById('icard-plate'); if(pl) pl.textContent=VH[cur].immat||'—';
  const km=document.getElementById('icard-km'); if(km) km.textContent=VH[cur].km?fk(VH[cur].km)+' km':'';
}

/* ── ACCORDÉON IDENTITÉ ── */
function togglePanel(){
  const panel=document.getElementById('icard-panel');
  const btn=document.getElementById('toggle-btn');
  const open=!panel.classList.contains('open');
  panel.classList.toggle('open',open);
  btn.classList.toggle('open',open);
  saveUI('panelOpen',open);
}
function toggleSec(id){
  const body=document.getElementById('sec-body-'+id);
  const h=document.getElementById('sec-h-'+id);
  const open=!body.classList.contains('open');
  body.classList.toggle('open',open);
  h.classList.toggle('open',open);
  const u=loadUI();
  u.sections=u.sections||{};
  u.sections[id]=open;
  localStorage.setItem(LS_UI,JSON.stringify(u));
}
function secOpen(id){ const u=loadUI(); return u.sections&&u.sections[id]!==undefined?u.sections[id]:true; }

/* génère une sous-section d'identité */
function iSec(id, title, fields){
  const open=secOpen(id);
  return `<div class="isec">
    <div class="isec-h${open?' open':''}" id="sec-h-${id}" onclick="toggleSec('${id}')">
      <span>${title}</span><span class="chev">▾</span>
    </div>
    <div class="isec-body${open?' open':''}" id="sec-body-${id}">
      <div class="igrid">${fields}</div>
    </div>
  </div>`;
}

function F(label,key,val,opts,mono,ph){
  const mc=mono?' mono-f':'';
  const cb=`upd('${key}',this.value)`;
  if(opts){
    return `<div class="if${mc}"><label>${label}</label>
      <select onchange="${cb}">${opts.map(o=>`<option${val===o?' selected':''}>${o}</option>`).join('')}</select>
    </div>`;
  }
  const t=(key==='date_mec'||key==='assur'||key==='ct_date'||key==='ct_valid')?'date':'text';
  return `<div class="if${mc}"><label>${label}</label>
    <input type="${t}" value="${(val||'').replace(/"/g,'&quot;')}" placeholder="${ph||''}" oninput="${cb}">
  </div>`;
}

/* ── FICHE IDENTITÉ ── */
function renderID(){
  const v=VH[cur];
  const panelOpen=UI.panelOpen!==false; // default open
  const color=COLORS[cur%COLORS.length];

  const resume=`<div style="display:flex;flex-direction:column;gap:1px">
    <div style="font-size:11px;color:var(--tm);font-family:var(--m)">${v.carb||''}${v.carb&&v.boite?' · ':''}${v.boite||''}${(v.carb||v.boite)&&v.cyl?' · ':''}${v.cyl?v.cyl+' cm³':''}</div>
  </div>`;

  document.getElementById('zone-id').innerHTML=`
  <div class="icard">
    <div class="icard-summary" onclick="togglePanel()">
      <div class="stripe" style="background:${color}"></div>
      <div class="icard-info">
        <div class="icard-info iname" id="icard-name">${v.designation||'Véhicule '+(cur+1)}</div>
        <div class="icard-meta">
          <span class="plate" id="icard-plate">${v.immat||'—'}</span>
          ${v.km?`<span class="imeta-pill" id="icard-km">${fk(v.km)} km</span>`:'<span id="icard-km"></span>'}
          ${v.carb?`<span class="imeta-pill">${v.carb}</span>`:''}
          ${v.version?`<span class="imeta-pill" style="display:none" id="ver-pill">${v.version}</span>`:''}
        </div>
      </div>
      <button class="toggle-btn${panelOpen?' open':''}" id="toggle-btn" onclick="event.stopPropagation();togglePanel()">▾</button>
    </div>
    <div class="icard-panel${panelOpen?' open':''}" id="icard-panel">
      ${iSec('id','Identification & carte grise',
        F('Désignation complète','designation',v.designation,null,false,'ex: Peugeot 308 SW')+
        F('Immatriculation','immat',v.immat,null,true,'AB-123-CD')+
        F('1ère mise en circulation','date_mec',v.date_mec,null,false)+
        F('N° de série (VIN/NIV)','vin',v.vin,null,true,'17 caractères')+
        F('Marque','marque',v.marque,null,false,'ex: Peugeot')+
        F('Modèle','modele',v.modele,null,false,'ex: 308')+
        F('Version / finition','version',v.version,null,false,'ex: 1.5 BlueHDi')+
        F('Genre (VP/VU…)','genre',v.genre,null,false,'VP')
      )}
      ${iSec('tech','Caractéristiques techniques',
        F('Carburant','carb',v.carb,CARBS,false)+
        F('Boîte de vitesse','boite',v.boite,BOITES,false)+
        F('Couleur','couleur',v.couleur,COLS,false)+
        F('Puissance fiscale (CV)','pf',v.pf,null,true,'ex: 7')+
        F('Puissance DIN (ch)','pdin',v.pdin,null,true,'ex: 130')+
        F('Cylindrée (cm³)','cyl',v.cyl,null,true,'ex: 1499')+
        F('Nb de places','places',v.places,null,true,'5')+
        F('PTAC (kg)','ptac',v.ptac,null,true,'ex: 1800')
      )}
      ${iSec('admin','Administratif & assurance',
        F('Kilométrage actuel','km',v.km,null,true,'ex: 87500')+
        F('Propriétaire / Titulaire','proprio',v.proprio,null,false,'Nom ou société')+
        F('Assurance — échéance','assur',v.assur,null,false)+
        F('Dernier CT','ct_date',v.ct_date,null,false)+
        F('CT valable jusqu\'au','ct_valid',v.ct_valid,null,false)
      )}
    </div>
  </div>`;

  // Sync UI state
  if(UI.panelOpen===false){
    document.getElementById('icard-panel').classList.remove('open');
    document.getElementById('toggle-btn').classList.remove('open');
  }
}

/* ── SECTIONS DYNAMIQUES ── */
function renderDyn(){
  const v=VH[cur];
  const total=tot(v);
  const sorted=[...v.entretiens].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const last=sorted[0]||null;
  const ctExp=v.ct_valid&&new Date(v.ct_valid)<new Date();
  const ctC=!v.ct_valid?'':ctExp?'ct-ko':'ct-ok';

  const rows=sorted.length===0
    ?`<tr><td colspan="8" class="empty">Aucune intervention enregistrée.</td></tr>`
    :sorted.map((e,si)=>`<tr>
      <td><input class="ti" type="date" value="${e.date||''}" onchange="updE(${si},'date',this.value)"></td>
      <td><input class="ti mono-ti" type="text" value="${e.km||''}" placeholder="km" style="width:72px" oninput="updE(${si},'km',this.value)"></td>
      <td style="white-space:nowrap">
        <select class="ti-sel" onchange="onTypeChgE(this,${si})">${TYPES.map(t=>`<option${(TYPES.slice(0,-1).includes(e.type)?e.type===t:t==='Autre')?' selected':''}>${t}</option>`).join('')}</select>
        <input class="ti" type="text" placeholder="Préciser…" style="display:${TYPES.slice(0,-1).includes(e.type)?'none':'inline'};width:100px;font-size:11px;margin-left:4px" value="${TYPES.slice(0,-1).includes(e.type)?'':e.type}" oninput="updE(${si},'type',this.value)">
      </td>
      <td><input class="ti" type="text" value="${(e.garage||'').replace(/"/g,'&quot;')}" placeholder="Garage" oninput="updE(${si},'garage',this.value)"></td>
      <td><input class="ti mono-ti" type="text" value="${e.cout||''}" placeholder="€" style="width:58px" oninput="updE(${si},'cout',this.value)"></td>
      <td><input class="ti mono-ti" type="text" value="${(e.facture||'').replace(/"/g,'&quot;')}" placeholder="N° fact." style="width:80px" oninput="updE(${si},'facture',this.value)"></td>
      <td><input class="ti" type="text" value="${(e.notes||'').replace(/"/g,'&quot;')}" placeholder="Notes" oninput="updE(${si},'notes',this.value)"></td>
      <td><button class="bdel" onclick="delE(${si})">✕</button></td>
    </tr>`).join('');

  const echs=v.prochains.length===0
    ?`<p class="empty">Aucune échéance planifiée.</p>`
    :v.prochains.map((p,i)=>`
      <div class="ech ${p.prio}">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <input class="ech-inp" type="text" value="${(p.type||'').replace(/"/g,'&quot;')}" placeholder="Type d'intervention" oninput="updP(${i},'type',this.value)">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input class="ech-inp mono-ti" type="text" value="${p.km||''}" placeholder="km prévu" style="width:90px" oninput="updP(${i},'km',this.value)">
            <input class="ech-inp mono-ti" type="text" value="${p.date||''}" placeholder="2026-06" style="width:80px" oninput="updP(${i},'date',this.value)">
          </div>
        </div>
        <select class="esel" onchange="setPrio(${i},this.value)">
          <option value="ok"${p.prio==='ok'?' selected':''}>✓ OK</option>
          <option value="soon"${p.prio==='soon'?' selected':''}>⏳ Bientôt</option>
          <option value="urgent"${p.prio==='urgent'?' selected':''}>⚠ Urgent</option>
        </select>
        <button class="bdel" onclick="delP(${i})">✕</button>
      </div>`).join('');

  document.getElementById('zone-dyn').innerHTML=`
  <div class="stats">
    <div class="sc"><div class="sl">Kilométrage</div>
      <div class="sv">${v.km?fk(v.km):'—'}<span class="su">km</span></div>
      <div class="ss">${last?'Dernier: '+fd(last.date):'—'}</div></div>
    <div class="sc"><div class="sl">Interventions</div>
      <div class="sv">${v.entretiens.length}</div><div class="ss">enregistrées</div></div>
    <div class="sc"><div class="sl">Dépenses totales</div>
      <div class="sv">${Math.round(total).toLocaleString('fr-FR')}<span class="su">€</span></div>
      <div class="ss">toutes interventions</div></div>
    <div class="sc"><div class="sl">CT valable jusqu'au</div>
      <div class="sv ${ctC}" style="font-size:14px;margin-top:3px">${v.ct_valid?fd(v.ct_valid):'—'}</div>
      <div class="ss">${ctExp?'⚠ Dépassé':v.ct_valid?'✓ Valide':''}</div></div>
  </div>

  <div class="sec">
    <div class="sec-h">
      <h3><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Historique des interventions</h3>
      <button class="btn-add" onclick="toggleAdd()">+ Ajouter</button>
    </div>
    <div class="twrap"><table class="ht">
      <thead><tr><th>Date</th><th>Km</th><th>Intervention</th><th>Garage</th><th>Coût</th><th>Facture</th><th>Notes</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="af${adding?' open':''}" id="af">
      <div class="fg">
        <div class="ff"><label>Date</label><input type="date" id="fd" value="${new Date().toISOString().split('T')[0]}"></div>
        <div class="ff"><label>Kilométrage</label><input id="fkm" placeholder="ex: 88000"></div>
        <div class="ff"><label>Coût (€)</label><input id="fc" placeholder="ex: 250"></div>
      </div>
      <div class="fg">
        <div class="ff"><label>Type d'intervention</label>
          <select id="ft" onchange="onTypeChgForm(this)">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
          <input id="ft-autre" type="text" placeholder="Préciser le type…" style="display:none;margin-top:6px" class="ff-autre">
        </div>
        <div class="ff"><label>Garage / Prestataire</label><input id="fg2" placeholder="Nom du garage"></div>
        <div class="ff"><label>N° de facture</label><input id="ff2" placeholder="ex: F-2025-001"></div>
      </div>
      <div class="ff"><label>Notes</label><textarea id="fn" placeholder="Pièces, références, observations..."></textarea></div>
      <div class="fac">
        <button class="bsave" onclick="saveE()">Enregistrer</button>
        <button class="bcancel" onclick="toggleAdd()">Annuler</button>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h">
      <h3><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Prochaines échéances</h3>
      <button class="btn-add" onclick="addP()">+ Ajouter</button>
    </div>
    <div class="echl">${echs}</div>
  </div>

  <div class="sec">
    <div class="sec-h">
      <h3><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Notes générales</h3>
    </div>
    <div class="narea">
      <textarea placeholder="Observations, historique, accidents, modifications..." oninput="upd('notes',this.value)">${v.notes||''}</textarea>
    </div>
  </div>`;
}

/* ── ACTIONS ── */
function toggleAdd(){
  adding=!adding; renderDyn();
  if(adding) setTimeout(()=>document.getElementById('af').scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}
function saveE(){
  const date=document.getElementById('fd').value; if(!date) return;
  VH[cur].entretiens.push({
    date, km:document.getElementById('fkm').value,
    type:(document.getElementById('ft').value==='Autre'&&document.getElementById('ft-autre').style.display!=='none'
      ?document.getElementById('ft-autre').value||'Autre'
      :document.getElementById('ft').value),
    garage:document.getElementById('fg2').value,
    cout:document.getElementById('fc').value,
    facture:document.getElementById('ff2').value,
    notes:document.getElementById('fn').value
  });
  adding=false; saveData(); renderDyn();
}
function delE(si){
  if(!confirm('Supprimer cette intervention ?')) return;
  const s=[...VH[cur].entretiens].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const ri=VH[cur].entretiens.indexOf(s[si]);
  VH[cur].entretiens.splice(ri,1); saveData(); renderDyn();
}
function addP(){
  const type=prompt("Type d'intervention :"); if(!type) return;
  const km=prompt("Kilométrage prévu (vide si N/A) :")||'';
  const date=prompt("Date prévue (ex: 2026-08) :")||'';
  VH[cur].prochains.push({type,km,date,prio:'ok'}); saveData(); renderDyn();
}
function updE(si,field,val){
  const sorted=[...VH[cur].entretiens].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const entry=sorted[si];
  const ri=VH[cur].entretiens.indexOf(entry);
  if(ri>=0){ VH[cur].entretiens[ri][field]=val; saveData(); }
}
function onTypeChgE(sel,si){
  const inp=sel.nextElementSibling;
  if(sel.value==='Autre'){ inp.style.display='inline'; inp.focus(); updE(si,'type',inp.value||'Autre'); }
  else{ inp.style.display='none'; updE(si,'type',sel.value); }
}
function onTypeChgForm(sel){
  const inp=document.getElementById('ft-autre');
  if(sel.value==='Autre'){ inp.style.display='block'; inp.focus(); }
  else{ inp.style.display='none'; }
}
function updP(i,field,val){ VH[cur].prochains[i][field]=val; saveData(); }
function setPrio(i,val){ VH[cur].prochains[i].prio=val; saveData(); renderDyn(); }
function delP(i){ VH[cur].prochains.splice(i,1); saveData(); renderDyn(); }

/* ── INIT ── */
renderTabs(); renderID(); renderDyn();
</script>
</body>
</html>
